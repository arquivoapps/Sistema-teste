<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Arquivo HTML</title>
<style>
body{
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f4f4f4;
}
textarea{
    width:100%;
    height:300px;
    font-family: monospace;
    font-size:14px;
}
button{
    margin-top:10px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>Gerador de Arquivo HTML</h2>
<p>Cole ou escreva seu código HTML abaixo:</p>

<textarea id="codigoHTML" placeholder="<html>...</html>"></textarea>
<br>

<button onclick="gerarArquivo()">Baixar arquivo .html</button>

<script>
function gerarArquivo(){
    const codigo = document.getElementById("codigoHTML").value;

    const blob = new Blob([codigo], {type: "text/html"});
    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "pagina.html";

    link.click();
}
</script>

</body>
</html>
